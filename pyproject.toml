[tool.poetry]
name = "ocma"
version = "0.3.0"
description = ""
authors = ["Sean Blackburn <birdicode@gmail.com>"]
license = "MIT"
packages = [{ include = "ocma" }, { include = "ocma/py.typed" }]

[tool.poetry.dependencies]
python = "^3.9"
selenium = "^4.1.0"
OTPpy = "^0.1.2"

[tool.poetry.group.dev.dependencies]
black = "^23.1.0"
pre-commit = "^3.0.4"
pydocstyle = "^6.1.1"
pylint = "^3.0.3"
mypy = "^1.0.1"
pytest = "^7.2.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
ocma = 'ocma.cli:run'

[tool.isort]
profile = "black"


[tool.ruff]
target-version = "py311"
extend-include = ["*.ipynb"]
show-fixes = true

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # Pyflakes
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "I",   # isort
  "C90", # MCcabe
  "N",   # pep8 naming
  "D",   # pydocstyle
  "UP",  # pyupgrade
  "ICN", # import-conventions
  "G",   # logging-format
  "PIE", # PIE
  "RET", # return values
  "TCH", # type-checking
  "PTH", # Use pathlib
  "PD",  # pandas-vet
  "PL",  # Pylint
  "TRY", # tryceratops
  "NPY", # NumPy-specific rules
  "RUF", # Ruff-specific rules
  # "FURB", # Refurb (Currently preview)
  "PERF", # Perflint
  "FA",   # Future annotations
  "ISC",  # Implicit string concat
  "INP",  # No __init__.py file
  "C4",   # Comprehensions
  "COM",  # Commas
  "A",    # Builtin shadowing
  "ANN",  # Annotations
  "W",    # warning
]
ignore = ["E501", "ANN101", "ANN102", "TRY003"]

[tool.ruff.lint.pep8-naming]
ignore-names = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
  "D100", # No need to write a docstring at the top of the file
  "B018", # It's okay to have a variable at the end of a cell to print its value
]
"*_test.py" = ["PLR2004"] # Test files may have constants without names

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict = true
pretty = true
# disallow_untyped_decorators = false

plugins = []

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["otppy.*"]

# https://jsh9.github.io/pydoclint/config_options.html
[tool.pydoclint]
style = 'numpy'
exclude = '\.git|data'
allow-init-docstring = true
skip-checking-short-docstrings = false
