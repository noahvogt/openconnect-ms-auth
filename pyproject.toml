[tool.poetry]
name = "ocma"
version = "0.1.1"
description = ""
authors = ["Sean <birdicode@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.9"
selenium = "^4.1.0"
OTPpy = "^0.1.2"

[tool.poetry.dev-dependencies]
mypy = "^0.931"
pydocstyle = "^6.1.1"
black = "^22.1.0"
pytest = "^7.0.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
ocma = 'ocma.cli:run'

[tool.isort]
multi_line_output=9
