[tool.poetry]
name = "ocma"
version = "0.1.5"
description = ""
authors = ["Sean Blackburn <birdicode@gmail.com>"]
license = "MIT"
packages = [
  {include = "ocma"},
  {include = "ocma/py.typed"},
]

[tool.poetry.dependencies]
python = "^3.9"
selenium = "^4.1.0"
OTPpy = "^0.1.2"

[tool.poetry.dev-dependencies]
mypy = "^0.982"
pydocstyle = "^6.1.1"
black = "^22.1.0"
pytest = "^7.0.1"

[tool.poetry.group.dev.dependencies]
black = "^22.8.0"
pre-commit = "^2.20.0"
pydocstyle = "^6.1.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
ocma = 'ocma.cli:run'

[tool.isort]
multi_line_output=9
