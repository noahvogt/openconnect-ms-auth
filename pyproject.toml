[project]
name = "ocma"
version = "0.6.0"
description = "Openconnect Microsoft Authenticator"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
authors = [
  { name = "Sean Blackburn", email = "birdicode@gmail.com" },
  { name = "Noah Vogt", email = "noah@noahvogt.com" },
]
requires-python = ">=3.11"
dependencies = ["selenium>=4.1.0", "pyotp>=2.9.0"]

[project.scripts]
ocma = "ocma.cli:run"

[dependency-groups]
dev = [
  "mypy>=1.9.0",
  "pylint>=3.1.0",
  "pre-commit>=4.0.1",
  "ruff>=0.7.1",
  "pytest>=8.1.1",
]

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py311"

show-fixes = true

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # Pyflakes
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "I",   # isort
  "C90", # MCcabe
  "N",   # pep8 naming
  "D",   # pydocstyle
  "UP",  # pyupgrade
  "ICN", # import-conventions
  "G",   # logging-format
  "PIE", # PIE
  "RET", # return values
  "TCH", # type-checking
  "PTH", # Use pathlib
  "PD",  # pandas-vet
  "PL",  # Pylint
  "TRY", # tryceratops
  "NPY", # NumPy-specific rules
  "RUF", # Ruff-specific rules
  # "FURB", # Refurb (Currently preview)
  "PERF", # Perflint
  "FA",   # Future annotations
  "ISC",  # Implicit string concat
  "INP",  # No __init__.py file
  "C4",   # Comprehensions
  "COM",  # Commas
  "A",    # Builtin shadowing
  "ANN",  # Annotations
  "W",    # warning
]
ignore = ["E501", "ANN101", "ANN102", "TRY003"]

[tool.ruff.lint.pep8-naming]
ignore-names = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["PLR2004"] # Test files may have constants without names

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = []


[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict = true
pretty = true
# disallow_untyped_decorators = false

plugins = []

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["pyotp.*"]

# https://jsh9.github.io/pydoclint/config_options.html
[tool.pydoclint]
style = 'numpy'
exclude = '\.git|data'
allow-init-docstring = true
skip-checking-short-docstrings = false
