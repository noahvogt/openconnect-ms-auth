name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # the oldest supported python with the oldest allowed versions of
          # the direct dependencies, to check the lower bounds in pyproject.toml
          - python-version: "3.11"
            sync-args: --resolution lowest-direct
          - python-version: "3.14"
            sync-args: --locked
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync ${{ matrix.sync-args }}
      - run: uv run --no-sync pytest -q

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # the test job already runs pytest
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: run-tests
