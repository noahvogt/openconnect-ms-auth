exclude: ^uv\.lock$
default_language_version:
  python: python3

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    # Please run `pre-commit install --hook-type commit-msg` to check commit messages
    rev: v4.19.1
    hooks:
      - id: commitizen

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-case-conflict
      - id: check-ast
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  # Integrate filename spell checking https://github.com/streetsidesoftware/cspell/issues/3063
  # currently using `make cspell-filenames` as a workaround.
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.3.0
    hooks:
      - id: cspell
        name: cspell
        additional_dependencies:
          - "@cspell/dict-de-ch@1.3.2"
          - "@cspell/dict-en-gb@5.0.34"
        args:
          - "lint"
          - "--show-suggestions"
          - "--no-must-find-files"

  - repo: https://github.com/jsh9/pydoclint
    rev: 0.11.0
    hooks:
      - id: pydoclint

  # ruff, mypy, pylint and pytest run from the project environment, so that
  # they use the versions locked in uv.lock.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: Run mypy
        entry: uv run mypy ocma
        language: system
        always_run: false
        types: [python]
        pass_filenames: false
        stages: [pre-commit, pre-merge-commit, pre-push, manual]
      - id: pylint
        name: Run pylint
        entry: uv run pylint -j 0 ocma
        language: system
        always_run: false
        types: [python]
        pass_filenames: false
        stages: [pre-commit, pre-merge-commit, pre-push, manual]
      - id: run-tests
        name: Run tests
        entry: uv run pytest
        language: system
        always_run: false
        types: [python]
        pass_filenames: false
        stages: [pre-commit, pre-merge-commit, pre-push, manual]
